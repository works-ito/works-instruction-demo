<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1260a2"><title>WORKS 作業指示｜デモ</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#203043;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#1260a2;color:white;padding:18px max(16px,calc((100vw - 700px)/2));}.top small{opacity:.85}.wrap{max-width:700px;margin:auto;padding:16px 14px 80px}.notice{background:#fff5db;color:#73510c;border:1px solid #f3dca0;padding:10px 12px;border-radius:10px;font-size:12px;margin-bottom:14px}.tabs,.seg{display:flex;background:#e5ebf2;padding:4px;border-radius:12px;gap:4px}.tabs button,.seg button{flex:1;background:transparent;color:#475569;border:0}.tabs button.active,.seg button.active{background:white;color:#1260a2;box-shadow:0 1px 5px #c4ccd5}.tabs button{font-size:15px}.seg button{font-size:13px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;background:#1260a2;color:white}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e8eff7;color:#12558e}.outline{background:white;color:#1260a2;border:1px solid #a9c7e0}.card{background:white;border:1px solid #e0e6ed;border-radius:13px;padding:15px;margin:12px 0;box-shadow:0 2px 6px #172b4508}.click{cursor:pointer}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grow{flex:1}.muted{color:#68798c;font-size:12px}.title{font-weight:750;font-size:16px}.pill{display:inline-block;background:#eaf2f9;color:#155a91;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:700}.red{background:#ffebec;color:#b52332}.green{background:#e5f7ed;color:#187445}.orange{background:#fff0d8;color:#995200}.space{height:12px}label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;background:white;font:inherit;font-size:15px;color:#1f2d3d}textarea{min-height:80px;resize:vertical}.check{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}.check input{width:auto;accent-color:#1260a2}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow button{flex:1}.btnrow button.selected{background:#1260a2;color:white}.btnrow button:not(.selected){background:#e8eff7;color:#325875}.full{width:100%;margin-top:14px}.section{margin:20px 0 10px;font-size:16px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{text-align:center;background:#fff;border-radius:12px;padding:12px 4px}.stat b{display:block;font-size:24px}.stat small{font-size:11px;color:#66788c}.item{display:flex;justify-content:space-between;gap:8px;margin:7px 0}.photo{background:#eef2f6;border:1px dashed #b9c8d5;border-radius:10px;padding:16px;text-align:center;color:#62758a;font-size:13px}.photo img{max-width:100%;max-height:280px;object-fit:contain;border-radius:8px}.hint{font-size:12px;color:#68798c;margin:6px 0}.kana{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:10px 0}.kana button{padding:9px 0;font-size:12px}.list{max-height:180px;overflow:auto;border:1px solid #e1e8f0;border-radius:10px}.choice{padding:12px;border-bottom:1px solid #edf0f5;cursor:pointer}.choice:last-child{border:0}.choice:hover{background:#f0f6fc}.hidden{display:none}.foot{text-align:center;font-size:11px;color:#8895a4;padding:20px}h2{font-size:19px;margin:14px 0}p{line-height:1.6}.error{color:#ba2734;font-size:13px}.line{border-top:1px solid #e5eaf0;margin:14px 0}@media(min-width:650px){.wrap{padding:24px 24px 80px}.top{padding-top:24px;padding-bottom:24px}}
</style></head><body><header class="top"><div style="font-size:20px;font-weight:800">WORKS｜作業指示</div><small>社内検討用プロトタイプ v0.1</small></header><main class="wrap"><div class="notice">⚠️ デモ版：入力内容はこの端末内の一時データのみです。画面を再読み込みすると初期化されます。通知・他端末共有はありません。実際の顧客情報や伝票写真は入力しないでください。</div><div class="tabs"><button id="tabOffice" class="active" onclick="switchRole('office')">業務部（送信）</button><button id="tabService" onclick="switchRole('service')">サービス部（受信）</button></div><div id="app"></div><div class="foot">WORKS 作業指示 デモ｜QR在庫管理とは連携していません</div></main><script>
const BR=['本社','三郷営業所','メインファクトリー'];
const CUSTOMERS=[{n:'株式会社三貴',k:'サンキ'},{n:'大岩工業株式会社',k:'オオイワ'},{n:'田中建設株式会社',k:'タナカ'},{n:'青山建設株式会社',k:'アオヤマ'},{n:'株式会社北斗',k:'ホクト'},{n:'山田工業株式会社',k:'ヤマダ'}];
let role='office',screen='list',current=null,branch='本社',filter='未完了',kind='出庫',selected=['本社'],client='',site='',date='2026-11-30',comment='',urgent=false,images=[],search='',kana='すべて',reply='';
let tasks=[{id:1,kind:'出庫',client:'株式会社三貴',site:'〇〇市役所',date:'2026-11-30',branches:['本社','メインファクトリー'],statuses:{'本社':'未確認','メインファクトリー':'未確認'},comment:'ハウス電源接続作業。伝票備考を確認。',urgent:false,images:[],replies:[],changes:[]},{id:2,kind:'返却',client:'大岩工業株式会社',site:'△△マンション',date:'2026-11-25',branches:['本社'],statuses:{'本社':'確認済み'},comment:'付属品の確認をお願いします。',urgent:false,images:[],replies:[],changes:[]},{id:3,kind:'出庫',client:'田中建設株式会社',site:'現場未定',date:'2026-12-05',branches:['三郷営業所'],statuses:{'三郷営業所':'未確認'},comment:'現場は後日連絡します。',urgent:true,images:[],replies:[],changes:[]}];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),badge=(s)=>'<span class="pill '+(s==='未確認'?'red':s==='準備完了'?'green':s==='至急'?'orange':'')+'">'+esc(s)+'</span>';
function switchRole(v){role=v;screen='list';$('tabOffice').classList.toggle('active',v==='office');$('tabService').classList.toggle('active',v==='service');render()}
function back(){screen='list';render()}
function openTask(id){current=id;screen='detail';render()}
function setBranch(v){branch=v;render()}
function setFilter(v){filter=v;render()}
function status(id,s){let t=tasks.find(t=>t.id===id);if(!t||!t.branches.includes(branch))return;t.statuses[branch]=s;render()}
function render(){let a=$('app');if(screen==='new')return renderNew();if(screen==='detail')return renderDetail();if(role==='office'){a.innerHTML='<button class="full" onclick="newTask()">＋ 新しい指示を作成</button><div class="section">送信した指示</div>'+tasks.slice().reverse().map(t=>card(t,false)).join('')}else{let v=tasks.filter(t=>t.branches.includes(branch)&& (filter==='すべて'||filter==='未完了'&&t.statuses[branch]!=='準備完了'||t.statuses[branch]===filter));a.innerHTML='<label>担当拠点</label><select onchange="setBranch(this.value)">'+BR.map(b=>'<option '+(b===branch?'selected':'')+'>'+b+'</option>').join('')+'</select><div class="stats">'+['未確認','確認済み','準備完了'].map(s=>'<div class="stat"><b>'+tasks.filter(t=>t.statuses[branch]===s).length+'</b><small>'+s+'</small></div>').join('')+'</div><div class="section">指示一覧</div><div class="seg">'+['未完了','未確認','確認済み','準備完了','すべて'].map(f=>'<button class="'+(filter===f?'active':'')+'" onclick="setFilter(\''+f+'\')">'+(f==='準備完了'?'完了':f)+'</button>').join('')+'</div>'+(v.length?v.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>card(t,true)).join(''):'<div class="card muted">該当する指示はありません。</div>')}}
function card(t,service){return '<div class="card click" onclick="openTask('+t.id+')"><div class="row"><b>'+esc(t.client)+'</b>'+(service?badge(t.statuses[branch]):badge(t.kind))+'</div><div class="space"></div><div class="row"><span style="font-size:14px"><b>'+esc(t.date.slice(5).replace('-','/'))+'</b>　｜　'+esc(t.site)+'</span>'+(t.urgent?badge('至急'):'')+'</div><div class="space"></div><div class="row"><span class="muted">'+esc(t.kind)+' ・ '+esc(t.branches.join('／'))+'</span><span class="muted">詳細 ›</span></div></div>'}
function newTask(){screen='new';kind='出庫';selected=['本社'];client='';site='';date='2026-11-30';comment='';urgent=false;images=[];search='';kana='すべて';render()}
function kanaGroup(k){let x=(k||'').charAt(0);let gs=['アイウエオ','カキクケコ','サシスセソ','タチツテト','ナニヌネノ','ハヒフヘホ','マミムメモ','ヤユヨ','ラリルレロ','ワヲン'];return 'あかさたなはまやらわ'[gs.findIndex(g=>g.includes(x))]||'その他'}
function renderCustomers(){let x=$('customerChoices');if(!x)return;let matches=CUSTOMERS.filter(c=>(kana==='すべて'||kanaGroup(c.k)===kana)&&((c.n+c.k).toLowerCase().includes(search.toLowerCase())));x.innerHTML=matches.length?matches.map(c=>'<div class="choice" onclick="chooseCustomer(\''+c.n+'\')">'+esc(c.n)+'</div>').join(''):'<div class="choice muted">該当する顧客がありません</div>'}
function chooseCustomer(n){client=n;$('clientChosen').textContent=n}
function chooseKana(k){kana=k;document.querySelectorAll('.kana button').forEach(b=>b.classList.toggle('selected',b.textContent===k));renderCustomers()}
function chooseSite(v){site=v;$('site').value=v}
function toggleBranch(b,v){selected=v?[...new Set([...selected,b])]:selected.filter(x=>x!==b)}
function renderNew(){$('app').innerHTML='<button class="secondary" onclick="back()">‹ 一覧へ戻る</button><h2>新規作業指示</h2><label>指示区分 *</label><div class="btnrow">'+['出庫','返却','その他'].map(k=>'<button class="'+(kind===k?'selected':'')+'" onclick="kind=\''+k+'\';renderNew()">'+k+'</button>').join('')+'</div><label>送信先（複数選択可） *</label>'+BR.map(b=>'<label class="check"><input type="checkbox" '+(selected.includes(b)?'checked':'')+' onchange="toggleBranch(\''+b+'\',this.checked)">'+b+'</label>').join('')+'<label>顧客名 *</label><input placeholder="顧客名・カナで検索" oninput="search=this.value;renderCustomers()" value="'+esc(search)+'"><div class="kana">'+['すべて',...'あかさたなはまやらわ'].map(k=>'<button class="'+(kana===k?'selected':'')+'" onclick="chooseKana(\''+k+'\')">'+k+'</button>').join('')+'</div><div class="list" id="customerChoices"></div><div class="hint">選択中：<b id="clientChosen">'+esc(client||'未選択')+'</b>（顧客名はデモ用の架空マスタ）</div><label>現場名（略称可） *</label><input id="site" placeholder="例：〇〇市役所" value="'+esc(site)+'" oninput="site=this.value"><div class="btnrow" style="margin-top:8px">'+['現場未定','後日決定','来社時確認'].map(s=>'<button class="secondary" onclick="chooseSite(\''+s+'\')">'+s+'</button>').join('')+'</div><label>出庫・返却予定日 *</label><input type="date" value="'+esc(date)+'" onchange="date=this.value"><label>伝票写真（デモ用・最大5枚）</label><input type="file" accept="image/*" multiple onchange="loadImages(this.files)"><div class="hint" id="photoCount">'+images.length+'枚選択中（この端末内のみ）</div><label>コメント（任意）</label><textarea id="comment" placeholder="補足事項など" oninput="comment=this.value">'+esc(comment)+'</textarea><label class="check"><input type="checkbox" '+(urgent?'checked':'')+' onchange="urgent=this.checked">至急</label><button class="full" onclick="send()">指示を送信（デモ）</button>';renderCustomers()}
function loadImages(files){if(files.length>5){alert('写真は最大5枚です');return}images=[];let f=Array.from(files);if(!f.length)return;Promise.all(f.map(file=>new Promise(resolve=>{if(!file.type.startsWith('image/'))return resolve(null);let reader=new FileReader();reader.onload=()=>resolve({name:file.name,url:reader.result});reader.onerror=()=>resolve(null);reader.readAsDataURL(file)}))).then(v=>{images=v.filter(Boolean);if($('photoCount'))$('photoCount').textContent=images.length+'枚選択中（この端末内のみ）'})}
function send(){if(!client||!site.trim()||!date||!selected.length){alert('顧客名・現場名・予定日・送信先を入力してください');return}let t={id:Math.max(...tasks.map(t=>t.id))+1,kind,client,site:site.trim(),date,branches:[...selected],statuses:Object.fromEntries(selected.map(b=>[b,'未確認'])),comment,urgent,images:[...images],replies:[],changes:[]};tasks.push(t);alert('デモ送信しました。サービス部モードで確認できます。');screen='list';render()}
function renderDetail(){let t=tasks.find(x=>x.id===current);if(!t)return back();let s=t.statuses[branch];$('app').innerHTML='<button class="secondary" onclick="back()">‹ 一覧へ戻る</button><div class="card"><div class="row"><h2 style="margin:0">'+esc(t.client)+'</h2>'+badge(t.kind)+'</div><div class="item"><b>予定日</b><span>'+esc(t.date)+'</span></div><div class="item"><b>現場名</b><span>'+esc(t.site)+'</span></div><div class="item"><b>送信先</b><span>'+esc(t.branches.join('／'))+'</span></div>'+(t.urgent?badge('至急'):'')+'<div class="line"></div><b>伝票写真</b><div class="space"></div>'+(t.images.length?t.images.map(p=>'<div class="photo"><img alt="添付写真" src="'+p.url+'"></div>').join(''):'<div class="photo">デモ用の伝票写真は未添付です</div>')+'<label>指示コメント</label><p>'+esc(t.comment||'コメントなし')+'</p></div><div class="card"><b>拠点別の進捗</b>'+t.branches.map(b=>'<div class="item"><span>'+b+'</span>'+badge(t.statuses[b])+'</div>').join('')+'</div>'+(role==='service'&&t.branches.includes(branch)?'<div class="card"><b>現在の担当拠点：'+esc(branch)+'</b><div class="space"></div>'+(s==='未確認'?'<button class="full" onclick="status('+t.id+',\'確認済み\')">受領確認する</button>':s==='確認済み'?'<button class="full" onclick="status('+t.id+',\'準備完了\')">準備完了にする</button>':'<button class="full outline" onclick="status('+t.id+',\'確認済み\')">完了を取り消す</button>')+'</div>':'')+'<div class="card"><b>追加連絡・履歴</b>'+t.replies.map(r=>'<div class="line"></div><div class="muted">'+esc(r.author)+'</div><p>'+esc(r.text)+'</p>').join('')+'<label>追加コメント</label><textarea id="reply" placeholder="追加の連絡を入力"></textarea><button class="full outline" onclick="addReply()">コメントを追加</button></div>'}
function addReply(){let t=tasks.find(x=>x.id===current),v=$('reply').value.trim();if(!v)return;t.replies.push({author:role==='office'?'業務部':'サービス部（'+branch+'）',text:v});renderDetail()}
render();
</script></body></html>
